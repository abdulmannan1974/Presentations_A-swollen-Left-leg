<svg xmlns="http://www.w3.org/2000/svg" class="algorithm" viewBox="0 0 1710 580" role="img" aria-label="Before you tick: the two-gate test"><style>svg{background:#F7F5EF;font-family:Arial,sans-serif}.node rect{fill:#FFFEFA;stroke:#58758D;stroke-width:2}.node text{fill:#162535;font-size:30px}.node.red rect{fill:#F6E2E7;stroke:#B22D46}.node.green rect{fill:#E1EFE7;stroke:#236B55}.node.amber rect{fill:#F5ECD8;stroke:#886016}.edge{color:#58758D}.edge polyline{fill:none;stroke:currentColor;stroke-width:3}.edge text{fill:#162535;font-size:26px}</style><rect width="100%" height="100%" fill="#F7F5EF"/><defs><marker id="arrow-2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs><g class="edge"><polyline points="750,57 1070,57" marker-end="url(#arrow-2)"/><text x="925.0" y="45.0">None</text></g><g class="edge"><polyline points="395,115 395,220" marker-end="url(#arrow-2)"/><text x="410.0" y="155.5">Yes</text></g><g class="edge"><polyline points="750,277 1070,277" marker-end="url(#arrow-2)"/><text x="925.0" y="265.0">No</text></g><g class="edge"><polyline points="395,335 395,440" marker-end="url(#arrow-2)"/><text x="410.0" y="375.5">Yes</text></g><g class="node "><rect x="40" y="0" width="710" height="115" rx="10"/><text x="395.0" y="57.5" text-anchor="middle" dominant-baseline="middle">Name the decision this result could change</text></g><g class="node red"><rect x="1070" y="0" width="570" height="115" rx="10"/><text x="1355.0" y="57.5" text-anchor="middle" dominant-baseline="middle">No decision → do not request</text></g><g class="node "><rect x="40" y="220" width="710" height="115" rx="10"/><text x="395.0" y="277.5" text-anchor="middle" dominant-baseline="middle">Can this sample answer it reliably?</text></g><g class="node amber"><rect x="1070" y="220" width="570" height="115" rx="10"/><text x="1355.0" y="277.5" text-anchor="middle" dominant-baseline="middle">No → defer / agree a lab plan</text></g><g class="node green"><rect x="40" y="440" width="1600" height="120" rx="10"/><text x="840.0" y="500.0" text-anchor="middle" dominant-baseline="middle">Yes → targeted test + named reviewer + action plan</text></g></svg>