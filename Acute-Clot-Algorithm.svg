<svg xmlns="http://www.w3.org/2000/svg" class="algorithm" viewBox="0 0 1710 400" role="img" aria-label="Acute clot: act on danger first"><style>svg{background:#F7F5EF;font-family:Arial,sans-serif}.node rect{fill:#FFFEFA;stroke:#58758D;stroke-width:2}.node text{fill:#162535;font-size:30px}.node.red rect{fill:#F6E2E7;stroke:#B22D46}.node.green rect{fill:#E1EFE7;stroke:#236B55}.node.amber rect{fill:#F5ECD8;stroke:#886016}.edge{color:#58758D}.edge polyline{fill:none;stroke:currentColor;stroke-width:3}.edge text{fill:#162535;font-size:26px}</style><rect width="100%" height="100%" fill="#F7F5EF"/><defs><marker id="arrow-1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs><g class="edge"><polyline points="365,150 420,150 420,65 500,65" marker-end="url(#arrow-1)"/><text x="447.5" y="95.5">Yes</text></g><g class="edge"><polyline points="365,220 420,220 420,317 500,317" marker-end="url(#arrow-1)"/><text x="447.5" y="256.5">Stable</text></g><g class="edge"><polyline points="1040,65 1100,65 1100,175 1170,175" marker-end="url(#arrow-1)"/><text x="1120.0" y="108.0"></text></g><g class="edge"><polyline points="1040,317 1100,317 1100,240 1170,240" marker-end="url(#arrow-1)"/><text x="1120.0" y="266.5"></text></g><g class="node red"><rect x="15" y="120" width="350" height="145" rx="10"/><text x="190.0" y="171.5" text-anchor="middle" dominant-baseline="middle">Threat to life</text><text x="190.0" y="213.5" text-anchor="middle" dominant-baseline="middle">or limb?</text></g><g class="node red"><rect x="500" y="0" width="540" height="130" rx="10"/><text x="770.0" y="44.0" text-anchor="middle" dominant-baseline="middle">YES · Emergency escalation</text><text x="770.0" y="86.0" text-anchor="middle" dominant-baseline="middle">Resuscitation + specialist team</text></g><g class="node "><rect x="500" y="255" width="540" height="125" rx="10"/><text x="770.0" y="296.5" text-anchor="middle" dominant-baseline="middle">Confirm clot and extent</text><text x="770.0" y="338.5" text-anchor="middle" dominant-baseline="middle">Use the diagnostic pathway</text></g><g class="node green"><rect x="1170" y="125" width="520" height="165" rx="10"/><text x="1430.0" y="165.5" text-anchor="middle" dominant-baseline="middle">Assess bleeding + baseline tests</text><text x="1430.0" y="207.5" text-anchor="middle" dominant-baseline="middle">Start suitable anticoagulation</text><text x="1430.0" y="249.5" text-anchor="middle" dominant-baseline="middle">Do not wait for thrombophilia</text></g></svg>